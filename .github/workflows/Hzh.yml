name: SpotiFLAC Spotify Link Test

on:
  workflow_dispatch:
    inputs:
      spotify_url:
        description: "Spotify track, album, or playlist URL"
        required: true
        type: string
        default: "https://open.spotify.com/album/5taTpZ0O8dFCcdH3UTJXHO"

permissions:
  contents: read

jobs:
  test:
    name: Test SpotiFLAC
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        id: system
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG_VERSION=$(ffmpeg -version | head -n 1)" >> "$GITHUB_OUTPUT"
          ffmpeg -version | head -n 1

      - name: Install SpotiFLAC
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install SpotiFLAC
          python -m pip show SpotiFLAC
          echo "SPOTIFLAC_VERSION=$(python -m pip show SpotiFLAC | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check CLI
        id: cli
        run: |
          set +e
          spotiflac --help > cli-help.txt 2>&1
          result=$?
          echo "CLI_EXIT_CODE=$result" >> "$GITHUB_OUTPUT"
          cat cli-help.txt
          exit "$result"

      - name: Validate Spotify URL
        id: validate
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlparse

          url = os.environ["SPOTIFY_URL"].strip()
          parsed = urlparse(url)
          match = re.fullmatch(
              r"/(track|album|playlist)/([A-Za-z0-9]+)",
              parsed.path.rstrip("/")
          )

          if parsed.scheme != "https" or parsed.netloc != "open.spotify.com" or not match:
              print("URL_VALIDATION=FAILED")
              print("Expected a Spotify track, album, or playlist URL.")
              sys.exit(1)

          print("URL_VALIDATION=PASSED")
          print(f"SPOTIFY_TYPE={match.group(1)}")
          print(f"SPOTIFY_ID={match.group(2)}")
          PY

      - name: Run SpotiFLAC diagnostic test
        id: test
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        shell: bash
        run: |
          mkdir -p test-output
          set +e

          spotiflac \
            --verbose \
            --log-level DEBUG \
            --no-enrich \
            --no-lyrics \
            "$SPOTIFY_URL" \
            ./test-output 2>&1 | tee spotiflac-debug.log

          result=${PIPESTATUS[0]}

          echo "SPOTIFLAC_EXIT_CODE=$result" | tee -a "$GITHUB_OUTPUT"
          echo "$result" > spotiflac-exit-code.txt

          exit 0

      - name: Collect diagnostic information
        if: always()
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
          SPOTIFLAC_EXIT_CODE: ${{ steps.test.outputs.SPOTIFLAC_EXIT_CODE }}
          CLI_EXIT_CODE: ${{ steps.cli.outputs.CLI_EXIT_CODE }}
          SPOTIFLAC_VERSION: ${{ steps.install.outputs.SPOTIFLAC_VERSION }}
          FFMPEG_VERSION: ${{ steps.system.outputs.FFMPEG_VERSION }}
          URL_VALIDATION: ${{ steps.validate.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CLI_RESULT: ${{ steps.cli.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
        shell: bash
        run: |
          mkdir -p test-output

          {
            echo "SPOTIFLAC_DIAGNOSTIC_REPORT"
            echo "=========================="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Python: $(python --version 2>&1)"
            echo "SpotiFLAC version: ${SPOTIFLAC_VERSION:-unknown}"
            echo "FFmpeg: ${FFMPEG_VERSION:-unknown}"
            echo "Spotify URL: $SPOTIFY_URL"
            echo "URL validation: ${URL_VALIDATION:-not completed}"
            echo "Install step: ${INSTALL_RESULT:-not completed}"
            echo "CLI step: ${CLI_RESULT:-not completed}"
            echo "CLI exit code: ${CLI_EXIT_CODE:-unknown}"
            echo "Test step: ${TEST_RESULT:-not completed}"
            echo "SpotiFLAC exit code: ${SPOTIFLAC_EXIT_CODE:-unknown}"
            echo
            echo "OUTPUT FILES"
            echo "------------"
            find test-output -maxdepth 5 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
            echo
            echo "DEBUG LOG: LAST 100 LINES"
            echo "-------------------------"
            if [ -f spotiflac-debug.log ]; then
              tail -n 100 spotiflac-debug.log
            else
              echo "Debug log was not created."
            fi
          } > diagnostic-summary.txt

          cat diagnostic-summary.txt

          {
            echo "# SpotiFLAC Diagnostic Summary"
            echo
            echo '```text'
            cat diagnostic-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotiflac-diagnostics-${{ github.run_id }}
          path: |
            diagnostic-summary.txt
            spotiflac-debug.log
            spotiflac-exit-code.txt
            cli-help.txt
            test-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Set final workflow status
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CLI_RESULT: ${{ steps.cli.outcome }}
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
          TEST_EXIT_CODE: ${{ steps.test.outputs.SPOTIFLAC_EXIT_CODE }}
        run: |
          if [ "$INSTALL_RESULT" != "success" ] ||
             [ "$CLI_RESULT" != "success" ] ||
             [ "$VALIDATION_RESULT" != "success" ] ||
             [ "$TEST_EXIT_CODE" != "0" ]; then
            echo "Diagnostic test failed. See the summary and uploaded artifacts."
            exit 1
          fi

          echo "Diagnostic command completed successfully."
