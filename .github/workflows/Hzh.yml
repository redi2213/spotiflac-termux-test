name: SpotiFLAC Spotify Link Test

on:
  workflow_dispatch:
    inputs:
      spotify_url:
        description: "Public Spotify track, album, or playlist URL"
        required: true
        type: string
        default: "https://open.spotify.com/track/4uLU6hMCjMI75M1A2tKUQC"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SpotiFLAC
        run: |
          python -m pip install --upgrade pip
          python -m pip install SpotiFLAC
          python -m pip check

      - name: Inspect CLI
        run: |
          spotiflac --help

      - name: Test Spotify URL
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["SPOTIFY_URL"].strip()
          parsed = urlparse(url)

          if parsed.scheme != "https" or parsed.hostname not in {
              "open.spotify.com",
              "www.open.spotify.com",
          }:
              raise SystemExit("Invalid Spotify URL")

          parts = [part for part in parsed.path.split("/") if part]
          if len(parts) < 2 or parts[0] not in {
              "track", "album", "playlist", "artist"
          }:
              raise SystemExit("Unsupported Spotify URL type")

          print("Spotify URL format: OK")
          print("Type:", parts[0])
          print("ID:", parts[1])
          PY

          spotiflac \
            "${{ inputs.spotify_url }}" \
            ./test-output
